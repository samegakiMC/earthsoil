<script>(function(){
  const root=document.documentElement;

  if(saved) root.dataset.theme=saved;
  const themeBtn=document.getElementById('themeToggle');
  if(themeBtn){ themeBtn.addEventListener('click',()=>{const next=root.dataset.theme==='light'?'dark':'light';root.dataset.theme=next;localStorage.setItem('earthsoil-theme',next);themeBtn.textContent=next==='light'?'☾':'☼';}); if(root.dataset.theme==='light') themeBtn.textContent='☾'; }
  const bar=document.getElementById('readingProgress');

})();

{q:'ดินเหนียวแน่น น้ำขังง่าย ควรหลีกเลี่ยงอะไร?',a:['เพิ่มอินทรียวัตถุ','ทำร่องระบายน้ำตามความเหมาะสม','เหยียบหรือใช้เครื่องจักรหนักบนดินเปียก','ปลูกพืชคลุมดิน'],ok:2,e:'ดินเปียกถูกอัดแน่นง่าย ทำให้ช่องว่างอากาศลดลงและน้ำระบายยากขึ้น'},
{q:'การป้องกันดินเสื่อมโทรมที่ยั่งยืนที่สุดคืออะไร?',a:['แก้เมื่อเสียหายแล้วเท่านั้น','ใช้วิธีเดิมทุกพื้นที่','ติดตามข้อมูลและปรับการจัดการให้เหมาะกับพื้นที่','เพิ่มปัจจัยการผลิตให้มากที่สุด'],ok:2,e:'ดินแต่ละพื้นที่ต่างกัน การติดตามข้อมูลและปรับวิธีสำคัญกว่าสูตรเดียว'}];
const f=document.getElementById('quizForm');
questions.forEach((x,i)=>{const s=document.createElement('fieldset');s.className='quiz-question';s.innerHTML=`<legend><span>0${i+1}</span>${x.q}</legend>${x.a.map((v,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${v}</span></label>`).join('')}<div class="explain" id="exp${i}"></div>`;f.appendChild(s)});
document.getElementById('submitQuiz').onclick=()=>{let score=0;questions.forEach((x,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const ex=document.getElementById('exp'+i);if(r&&+r.value===x.ok){score++;ex.textContent='✓ ถูกต้อง — '+x.e;ex.className='explain correct'}else{ex.textContent='✗ ยังไม่ตรง — '+x.e;ex.className='explain wrong'}});const box=document.getElementById('quizResult');box.hidden=false;box.innerHTML=`<div class="score">${score}<small>/ ${questions.length}</small></div><div><strong>${score>=4?'เข้าใจระบบดินได้ดีมาก':'ลองอ่านบทเรียนเพิ่มแล้วกลับมาทำใหม่'}</strong><p>${score>=4?'คุณเชื่อมโยงสาเหตุ ผลกระทบ และการป้องกันได้ดี':'แนะนำให้อ่าน “ดินเสื่อมโทรม” และ “วงจรตัดสินใจแก้ปัญหาดิน” ก่อน'}</p></div>`;box.scrollIntoView({behavior:'smooth',block:'center'})};
document.getElementById('resetQuiz').onclick=()=>location.reload();
</script></body></html>
